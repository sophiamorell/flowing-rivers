# Netlify build settings, so nothing has to be typed into the dashboard.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Baked into the page at build time (canonical URL, sitemap, Open Graph).
  NEXT_PUBLIC_SITE_URL = "https://flowingrivershealth.com"
  # Netlify's secret scanner flags RESEND_API_KEY because Next.js writes the
  # build environment into its cache under .next/cache. That cache is never
  # served, so skip it (and node_modules) when scanning.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**,node_modules/**"

# Netlify's Next.js Runtime. Without this the build output (.next) is served
# as plain static files, which 404s on every URL.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# RESEND_API_KEY and CONTACT_EMAIL are runtime secrets for the contact form.
# Set them in the Netlify dashboard (Site configuration -> Environment
# variables), not in this file.
